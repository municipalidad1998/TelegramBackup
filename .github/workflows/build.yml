name: Build APK

on:
  push:
    branches: [ main, 'claude/**', 'feature/**', 'develop' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get build info
        id: info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(grep versionName app/build.gradle.kts | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "tag=build-${BRANCH}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "is_main=${{ github.ref == 'refs/heads/main' }}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/TelegramBackup-${{ steps.info.outputs.version }}-${{ steps.info.outputs.sha_short }}.apk"

      - name: Delete previous pre-release for this branch (if exists)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.info.outputs.tag }}" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/${{ steps.info.outputs.tag }}" 2>/dev/null || true

      - name: Create/Update pre-release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "APK – ${{ steps.info.outputs.branch }} @ ${{ steps.info.outputs.sha_short }}"
          prerelease: ${{ steps.info.outputs.is_main == 'false' }}
          body: |
            ## TelegramBackup v${{ steps.info.outputs.version }}

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Fecha:** ${{ github.event.head_commit.timestamp }}

            ### Cómo instalar
            1. Descarga el APK de abajo ⬇️
            2. En tu Android: **Ajustes → Seguridad → Instalar apps desconocidas** (activar para tu navegador)
            3. Abre el archivo APK y toca **Instalar**

            ---
            > Pre-release automático desde el branch de desarrollo.
            > El APK está firmado con clave de depuración (debug key).
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

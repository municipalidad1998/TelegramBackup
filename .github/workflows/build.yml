name: Build APK

on:
  push:
    branches: [ main, 'claude/**', 'feature/**', 'develop' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build debug APK — signed automatically with the Android debug keystore,
      # always installable on any Android device without extra configuration.
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect build metadata
        id: meta
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHA=$(git rev-parse --short HEAD)
          # Replace / with - so the branch name is safe in tag names
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          TAG="apk-${BRANCH}-${SHA}"
          APK_NAME="TelegramBackup-v${VERSION}-${SHA}.apk"
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "sha=$SHA"           >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"     >> $GITHUB_OUTPUT
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.meta.outputs.apk_name }}"

      # Delete any previous release/tag for this same branch+commit so we
      # can recreate it cleanly (handles re-runs and force-pushes).
      - name: Remove old release for this tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.meta.outputs.tag }}" --yes 2>/dev/null || true
          git push origin ":refs/tags/${{ steps.meta.outputs.tag }}" 2>/dev/null || true

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "TelegramBackup v${{ steps.meta.outputs.version }} · ${{ steps.meta.outputs.branch }} · ${{ steps.meta.outputs.sha }}"
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 📲 TelegramBackup v${{ steps.meta.outputs.version }}

            | Campo | Valor |
            |-------|-------|
            | Branch | `${{ github.ref_name }}` |
            | Commit | `${{ github.sha }}` |
            | Build  | `#${{ github.run_number }}` |

            ---

            ### ⬇️ Instalación

            1. Descarga **`${{ steps.meta.outputs.apk_name }}`** (botón de abajo)
            2. En tu Android abre **Ajustes → Seguridad** y activa **"Instalar aplicaciones desconocidas"** para tu navegador/administrador de archivos
            3. Abre el APK descargado y toca **Instalar**

            > Este APK está firmado con la clave de depuración de Android (debug keystore) y es completamente instalable en cualquier dispositivo Android.
          files: dist/${{ steps.meta.outputs.apk_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  push:
    branches: [ main, 'claude/**', 'feature/**', 'develop' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHA=$(git rev-parse --short HEAD)
          APK_NAME="TelegramBackup-v${VERSION}-${SHA}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish to Gitea Release (latest-debug)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="${{ env.APK_NAME }}"
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          TAG="latest-debug"

          # Delete existing release for this tag
          EXISTING_ID=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Eliminando release anterior ID=${EXISTING_ID}"
            curl -s -X DELETE \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/releases/${EXISTING_ID}"
          fi
          # Delete tag
          curl -s -X DELETE \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/git/refs/tags/${TAG}" || true

          # Create new release
          BODY="### Instalacion\n1. Descarga **${APK_NAME}** de abajo\n2. Android: Ajustes → Seguridad → Instalar apps desconocidas\n3. Abre el APK e instala\n\n**Branch:** \`${GITHUB_REF_NAME}\`  \n**Commit:** \`${GITHUB_SHA:0:7}\`"
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/releases" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"TelegramBackup - Ultima version debug\",
              \"body\": \"${BODY}\",
              \"prerelease\": true
            }")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "AVISO: No se pudo crear el release via API."
            echo "Respuesta: $RELEASE"
            echo "El APK esta disponible como Artifact en esta accion."
            exit 0
          fi

          echo "Release creado ID=${RELEASE_ID}"

          # Upload APK
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${API}/releases/${RELEASE_ID}/assets?name=${APK_NAME}" \
            --data-binary @"dist/${APK_NAME}"

          echo "APK publicado en: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
